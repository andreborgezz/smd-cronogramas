<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Project Control Center</title>
<style>
  :root{
    --bg: #ffffff;
    --panel: #ffffff;
    --panel2: #eef4f9;
    --line: #dfe6ed;
    --text: #14181c;
    --muted: #6b7580;
    --accent: #0b68b2;
    --accent-dim: #0b68b214;
    --ok: #1a8f5e;
    --ok-dim: #1a8f5e14;
    --late: #c8402a;
    --late-dim: #c8402a14;
    --plan: #0b68b2;
    --plan-dim: #0b68b214;
    --warn: #b8860b;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', 'Helvetica Neue', Arial, 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 20px 80px;}

  /* barra utilitária fina no topo, com marca pequena */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 20px; border-bottom:1px solid var(--line); background:var(--panel2);
    margin:0 -20px 0; font-family:var(--mono); font-size:11px; color:var(--muted);
    letter-spacing:.03em;
  }
  .topbar .tb-left{display:flex; align-items:center; gap:8px;}
  .topbar img{height:16px; display:block; opacity:.85;}
  .topbar .tb-right{color:var(--muted);}

  header{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line); padding:22px 0 18px; margin-bottom:24px;
    flex-wrap:wrap; gap:16px;
  }
  .brand{display:flex; align-items:center; gap:16px;}
  .brand img.logo{height:52px; display:block;}
  .brand .divider{width:1px; height:34px; background:var(--line);}
  h1{font-size:19px; margin:0; font-weight:700; letter-spacing:-.01em; color:var(--text);}
  .sub{color:var(--muted); font-size:12px; margin-top:4px; font-family:var(--mono);}
  .tabs{display:flex; gap:22px;}
  .tab{
    font-family:var(--sans); font-size:12.5px; letter-spacing:.06em; text-transform:uppercase;
    background:transparent; border:0; border-bottom:2px solid transparent; color:var(--muted);
    padding:6px 2px 10px; cursor:pointer; transition:.15s; font-weight:600;
  }
  .tab.active{color:var(--accent); border-bottom-color:var(--accent);}
  .tab:hover:not(.active){color:var(--text);}

  .cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; margin-bottom:24px;}
  .card{background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:14px 16px;}
  .card .num{font-family:var(--mono); font-size:26px; font-weight:600; color:var(--text);}
  .card .lbl{color:var(--muted); font-size:11px; margin-top:4px; text-transform:uppercase; letter-spacing:.06em;}
  .card.ok .num{color:var(--ok);}
  .card.late .num{color:var(--late);}
  .card.warn .num{color:var(--warn);}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:4px; overflow:hidden; margin-bottom:20px;}
  .panel-h{
    padding:12px 16px; border-bottom:1px solid var(--line); font-size:13px; font-weight:700;
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel2);
  }
  .panel-h .cnt{color:var(--muted); font-family:var(--mono); font-weight:400; font-size:11.5px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); padding:9px 12px; border-bottom:1px solid var(--line); font-weight:700;
    white-space:nowrap;
  }
  td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--panel2);}
  .id{font-family:var(--mono); color:var(--muted); font-size:12px;}
  .name{font-weight:600;}
  .resp{color:var(--muted); font-size:12px;}
  .dates{font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:nowrap;}

  .status{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-family:var(--mono);
    padding:3px 8px; border-radius:3px; white-space:nowrap;
  }
  .status.concluido{background:var(--ok-dim); color:var(--ok);}
  .status.planejado{background:var(--plan-dim); color:var(--plan);}
  .status.atrasado{background:var(--late-dim); color:var(--late);}

  .dev{font-family:var(--mono); font-size:11.5px;}
  .dev.pos{color:var(--late);}
  .dev.neg{color:var(--ok);}
  .dev.zero{color:var(--muted);}

  input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); cursor:pointer;}
  input.pct{
    width:52px; background:#fff; border:1px solid var(--line); color:var(--text);
    font-family:var(--mono); font-size:12px; padding:4px 6px; border-radius:3px; text-align:right;
  }
  input.pct:focus{outline:none; border-color:var(--accent);}
  input.date-input{
    width:128px; background:#fff; border:1px solid var(--line); color:var(--text);
    font-family:var(--mono); font-size:12px; padding:4px 6px; border-radius:3px;
  }
  input.date-input:focus{outline:none; border-color:var(--accent);}
  input.date-input.unset{color:var(--muted); border-style:dashed;}

  .bar-bg{width:100%; background:var(--line); border-radius:3px; height:6px; overflow:hidden;}
  .bar-fg{height:100%; background:var(--accent); border-radius:3px; transition:width .2s;}

  .empty{padding:40px 16px; text-align:center; color:var(--muted); font-size:13px;}
  .foot-note{color:var(--muted); font-size:11.5px; margin-top:18px; line-height:1.6; font-family:var(--mono);}
  .save-flag{
    position:fixed; bottom:18px; right:18px; background:var(--text); border:1px solid var(--text);
    color:#fff; font-family:var(--mono); font-size:11px; padding:7px 12px; border-radius:4px;
    opacity:0; transform:translateY(6px); transition:.25s; pointer-events:none;
  }
  .save-flag.show{opacity:1; transform:translateY(0);}
</style>
</head>

function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function daysBetween(a,b){
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}

async function loadData(){
  try{
    const projRes = await window.storage.get(STORAGE_PROJECTS_KEY, false);
    projects = projRes ? JSON.parse(projRes.value) : [];
  }catch(e){ projects = []; }

  // Migração: código do processo mudou de OS-2026-1326 para RFQ_00146.
  // Renomeia o projeto e move as tarefas salvas para a nova chave, sem perder histórico.
  const OLD_ID = 'OS-2026-1326', NEW_ID = 'RFQ_00146';
  const oldProj = projects.find(p=>p.id===OLD_ID);
  if(oldProj){
    oldProj.id = NEW_ID;
    try{
      const oldTasksRes = await window.storage.get(taskKey(OLD_ID), false);
      if(oldTasksRes){
        await window.storage.set(taskKey(NEW_ID), oldTasksRes.value, false);
        await window.storage.delete(taskKey(OLD_ID), false);
      }
    }catch(e){}
    await window.storage.set(STORAGE_PROJECTS_KEY, JSON.stringify(projects), false);
  }

  let projectsChanged = false;
  for(const seed of ALL_SEEDS){
    if(!projects.find(p=>p.id===seed.proj.id)){
      projects.push({...seed.proj, createdAt: new Date().toISOString()});
      await window.storage.set(taskKey(seed.proj.id), JSON.stringify(seed.tasks), false);
      projectsChanged = true;
    }
  }
  if(projectsChanged){
    await window.storage.set(STORAGE_PROJECTS_KEY, JSON.stringify(projects), false);
  }

  tasksByProject = {};
  for(const p of projects){
    try{
      const tRes = await window.storage.get(taskKey(p.id), false);
      tasksByProject[p.id] = tRes ? JSON.parse(tRes.value).map(normalizeTask) : [];
    }catch(e){
      tasksByProject[p.id] = [];
    }
  }

  // Recalcular baseline (pedido explícito): RFQ_00146 (ex-OS-2026-1326) passa a usar
  // Início Prog. como início e Término Real como fim do baseline.
  // Roda uma única vez por conta (marcador em storage), preservando o baseline depois disso.
  const REBASE_FLAG_V2 = 'rebase:OS-2026-1326:v2';
  const REBASE_FLAG = 'rebase:RFQ_00146:v2';
  try{
    const flagOld = await window.storage.get(REBASE_FLAG_V2, false);
    const flagNew = await window.storage.get(REBASE_FLAG, false);
    if(!flagOld && !flagNew && tasksByProject[NEW_ID]){
      tasksByProject[NEW_ID] = REBASELINE_OS1326;
      await saveTasksSilent(NEW_ID);
      await window.storage.set(REBASE_FLAG, 'done', false);
    }
  }catch(e){
    if(tasksByProject[NEW_ID]){
      tasksByProject[NEW_ID] = REBASELINE_OS1326;
      await saveTasksSilent(NEW_ID);
      try{ await window.storage.set(REBASE_FLAG, 'done', false); }catch(e2){}
    }
  }

  // Correção pontual (não mexe em mais nada): MATERIAIS E RECURSOS recebe prazo de
  // baseline em 09/09/2026 — o dado original da fonte estava corrompido ("13/1/00").
  // Aplica sem sobrescrever edições que você já tenha feito em outras tarefas.
  const PATCH_FLAG = 'patch:RFQ_00146:materiais-e-recursos-prazo:v1';
  try{
    const patched = await window.storage.get(PATCH_FLAG, false);
    if(!patched && tasksByProject[NEW_ID]){
      const t13 = tasksByProject[NEW_ID].find(t=>t.id==='13');
      if(t13){
        t13.baselineEnd = '2026-09-09';
        if(!t13.currentEnd) t13.currentEnd = '2026-09-09';
        await saveTasksSilent(NEW_ID);
      }
      await window.storage.set(PATCH_FLAG, 'done', false);
    }
  }catch(e){}

  activeProjectId = projects[0].id;
}

// ---------- Agregação de containers (tarefas-resumo) ----------
function effectiveTasks(ts){
  // Retorna a lista com containers tendo seu % e status recalculados como
  // média das subatividades diretas (nunca editados manualmente).
  return ts.map(t=>{
    if(!t.isContainer) return t;
    const children = ts.filter(c => c.level === t.level+1 &&
      ts.indexOf(c) > ts.indexOf(t) &&
      ts.slice(ts.indexOf(t)+1, ts.indexOf(c)).every(m=>m.level>t.level));
    const valid = children.filter(c=>!c.na);
    const pct = valid.length ? Math.round(valid.reduce((s,c)=>s+(c.currentPercent||0),0)/valid.length) : t.currentPercent;
    const ends = valid.map(c=>c.currentEnd).filter(Boolean);
    const starts = valid.map(c=>c.currentStart).filter(Boolean);
    return {
      ...t,
      currentPercent: pct,
      currentEnd: ends.length ? ends.sort().slice(-1)[0] : t.currentEnd,
      currentStart: starts.length ? starts.sort()[0] : t.currentStart
    };
  });
}

function computeStatus(t){
  if(t.na) return {label:'N/A', cls:'planejado'};
  const today = todayISO();
  if(t.currentPercent >= 100) return {label:'Concluído', cls:'concluido'};
  const refEnd = t.currentEnd || t.baselineEnd;
  if(refEnd && refEnd < today) return {label:'Atrasado', cls:'atrasado'};
  if(t.currentPercent > 0) return {label:'Em andamento', cls:'planejado'};
  return {label:'Planejado', cls:'planejado'};
}
function computeDeviationDays(t){
  if(t.na || !t.baselineEnd) return 0;
  if(t.currentEnd) return daysBetween(t.baselineEnd, t.currentEnd);
  if(t.currentPercent < 100){
    const today = todayISO();
    if(t.baselineEnd < today) return daysBetween(t.baselineEnd, today);
  }
  return 0;
}
function computeReadjustDays(t){
  // Quanto a data atual se moveu desde o último ajuste feito manualmente nesta tarefa.
  // Diferente do desvio vs. baseline: aqui comparamos com o valor anterior salvo, não com o baseline original.
  if(t.na || t.isContainer || !t.previousEnd || !t.currentEnd) return null;
  return daysBetween(t.previousEnd, t.currentEnd);
}
function deviationLabel(dev){
  if(!dev) return {text:'no prazo', cls:'zero'};
  if(dev > 0) return {text:`+${dev}d atraso`, cls:'pos'};
  return {text:`${Math.abs(dev)}d adiant.`, cls:'neg'};
}
function readjustLabel(dev){
  if(dev === null) return {text:'—', cls:'zero'};
  if(dev === 0) return {text:'sem alteração', cls:'zero'};
  if(dev > 0) return {text:`+${dev}d`, cls:'pos'};
  return {text:`${dev}d`, cls:'neg'};
}

function renderOverview(){
  const el = document.getElementById('overviewView');
  const allTasks = projects.flatMap(p => effectiveTasks(tasksByProject[p.id]||[])
    .filter(t=>!t.isContainer && !t.na)
    .map(t => ({...t, _proj: p})));

  const totalTasks = allTasks.length;
  const doneTasks = allTasks.filter(t=>t.currentPercent>=100).length;
  const overallPct = totalTasks ? Math.round(allTasks.reduce((s,t)=>s+(t.currentPercent||0),0)/totalTasks) : 0;
  const lateTasks = allTasks.filter(t=>t.currentPercent<100 && (t.currentEnd||t.baselineEnd) < todayISO());
  const upcoming = allTasks.filter(t=>t.currentPercent<100 && t.baselineEnd && t.baselineEnd >= todayISO())
                            .sort((a,b)=>a.baselineEnd.localeCompare(b.baselineEnd)).slice(0,6);
  const worstDeviation = allTasks.map(t=>({...t, dev:computeDeviationDays(t)}))
                                  .filter(t=>t.dev !== 0)
                                  .sort((a,b)=>b.dev-a.dev).slice(0,6);

  let html = '';
  html += `<div class="cards">
    <div class="card"><div class="num">${projects.length}</div><div class="lbl">Projetos ativos</div></div>

  </div>`;

  html += `<div class="panel"><div class="panel-h">Conclusão por projeto</div><table><thead><tr>
    <th>Projeto</th><th>Atividades</th><th>Concluído</th><th>% Progresso</th><th>Atrasadas</th>
  </tr></thead><tbody>`;
  for(const p of projects){
    const ts = effectiveTasks(tasksByProject[p.id]||[]).filter(t=>!t.isContainer && !t.na);
    const done = ts.filter(t=>t.currentPercent>=100).length;
    const pct = ts.length ? Math.round(ts.reduce((s,t)=>s+(t.currentPercent||0),0)/ts.length) : 0;
    const late = ts.filter(t=>t.currentPercent<100 && (t.currentEnd||t.baselineEnd) < todayISO()).length;
    html += `<tr>
      <td class="name">${p.name}<div class="id">${p.id}</div></td>
      <td>${ts.length}</td>
      <td>${done}</td>
      <td style="min-width:140px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="bar-bg" style="flex:1;"><div class="bar-fg" style="width:${pct}%"></div></div>
          <span class="dates">${pct}%</span>
        </div>
      </td>
      <td>${late ? `<span class="status atrasado">${late}</span>` : '<span class="dates">0</span>'}</td>
    </tr>`;
  }
  html += `</tbody></table></div>`;

  html += `<div class="panel"><div class="panel-h">Atividades atrasadas<span class="cnt">data atual x baseline</span></div>`;
  if(lateTasks.length===0){
    html += `<div class="empty">Nenhuma atividade atrasada no momento.</div>`;
  } else {
    html += `<table><thead><tr><th>Projeto</th><th>Atividade</th><th>Responsável</th><th>Fim (baseline)</th><th>Desvio</th></tr></thead><tbody>`;
    for(const t of lateTasks.sort((a,b)=>computeDeviationDays(b)-computeDeviationDays(a))){
      const dev = computeDeviationDays(t);
      const dl = deviationLabel(dev);
      html += `<tr>
        <td class="dates">${t._proj.id}</td>
        <td class="name">${t.name}</td>
        <td class="resp">${t.resp}</td>
        <td class="dates">${fmtDate(t.baselineEnd)}</td>
        <td class="dev ${dl.cls}">${dl.text}</td>
      </tr>`;
    }
    html += `</tbody></table>`;
  }
  html += `</div>`;

  html += `<div class="panel"><div class="panel-h">Maior desvio de baseline</div>`;
  if(worstDeviation.length===0){
    html += `<div class="empty">Nenhum desvio registrado — tudo dentro do baseline.</div>`;
  } else {
    html += `<table><thead><tr><th>Projeto</th><th>Atividade</th><th>Baseline fim</th><th>Desvio</th></tr></thead><tbody>`;
    for(const t of worstDeviation){
      const dl = deviationLabel(t.dev);
      html += `<tr>
        <td class="dates">${t._proj.id}</td>
        <td class="name">${t.name}</td>
        <td class="dates">${fmtDate(t.baselineEnd)}</td>
        <td class="dev ${dl.cls}">${dl.text}</td>
      </tr>`;
    }
    html += `</tbody></table>`;
  }
  html += `</div>`;

  html += `<div class="panel"><div class="panel-h">Próximas atividades a vencer</div>`;
  if(upcoming.length===0){
    html += `<div class="empty">Nenhuma atividade planejada pendente.</div>`;
  } else {
    html += `<table><thead><tr><th>Projeto</th><th>Atividade</th><th>Responsável</th><th>Início</th><th>Fim</th></tr></thead><tbody>`;

  }
  html += `</div>`;

  el.innerHTML = html;

        <td><span class="status planejado">N/A</span></td>
        <td class="dev zero">—</td>
        <td class="dev zero">—</td>
      </tr>`;
      continue;
    }
    const status = computeStatus(t);
    const dev = computeDeviationDays(t);
    const dl = deviationLabel(dev);
    const rdev = computeReadjustDays(t);
    const rl = readjustLabel(rdev);
    const isContainer = t.isContainer;
    html += `<tr data-tid="${t.id}" ${isContainer?'style="background:var(--panel2);"':''}>
      <td class="id">${t.id}</td>
      <td>${isContainer ? '' : `<input type="checkbox" class="chk-done" ${t.currentPercent>=100?'checked':''}>`}</td>
      <td class="name" style="padding-left:${8+t.level*18}px;">${isContainer?'▾ ':''}${t.name}</td>
      <td class="resp">${t.resp}</td>
      <td class="dates">${fmtDate(t.baselineStart)} → ${fmtDate(t.baselineEnd)}</td>
      <td>${isContainer
          ? `<span class="dates">${t.currentPercent}%</span>`
          : `<input type="number" class="pct pct-input" min="0" max="100" value="${t.currentPercent}">`}</td>
      <td>${isContainer
          ? `<span class="dates">${fmtDate(t.currentEnd)}</span>`
          : `<input type="date" class="date-input end-input ${t.currentEnd?'':'unset'}" value="${t.currentEnd||''}">`}</td>
      <td><span class="status ${status.cls}">${status.label}</span></td>
      <td class="dev ${dl.cls}">${dl.text}</td>
      <td class="dev ${rl.cls}">${rl.text}</td>
    </tr>`;
  }
  html += `</tbody></table></div>`;
  if(rawTs.some(t=>t.name==='MATERIAIS E RECURSOS')){
    html += `<div class="foot-note" style="margin-top:-10px;">⚠ "MATERIAIS E RECURSOS" é uma tarefa-resumo — % e término real são calculados automaticamente a partir das subatividades de compras. O arquivo original trazia um "término real" inválido (13/1/00) para essa linha; deixamos em branco em vez de adivinhar.</div>`;
  }
  el.innerHTML = html;

  const sel = document.getElementById('projSelect');
  if(sel){
    sel.addEventListener('change', (e)=>{
      activeProjectId = e.target.value;
      renderProjectView();
    });
  }

  el.querySelectorAll('tr[data-tid]').forEach(row=>{
    const tid = row.getAttribute('data-tid');
    const task = rawTs.find(t=>t.id===tid);
    if(!task || task.isContainer || task.na) return;

    const chk = row.querySelector('.chk-done');
    if(chk){
      chk.addEventListener('change', async (e)=>{
        task.currentPercent = e.target.checked ? 100 : 0;
        if(e.target.checked && !task.currentEnd) task.currentEnd = todayISO();
        await saveTasks(activeProjectId);
        refreshAll();
      });
    }

    const pctInput = row.querySelector('.pct-input');
    if(pctInput){
      pctInput.addEventListener('change', async (e)=>{
        let v = parseInt(e.target.value,10);
        if(isNaN(v)) v = 0;
        v = Math.max(0, Math.min(100, v));
        task.currentPercent = v;
        await saveTasks(activeProjectId);
        refreshAll();
      });
    }

    const endInput = row.querySelector('.end-input');
    if(endInput){
      endInput.addEventListener('change', async (e)=>{
        const newVal = e.target.value || null;
        if(newVal && newVal !== task.currentEnd){
          task.previousEnd = task.currentEnd || task.baselineEnd;
        }
        task.currentEnd = newVal;
        if(!task.currentStart) task.currentStart = task.currentEnd;
        await saveTasks(activeProjectId);
        refreshAll();
      });
    }
  });
}

function setHeader(){
  const totalTasks = projects.reduce((s,p)=>s+(tasksByProject[p.id]||[]).filter(t=>!t.isContainer).length,0);
  document.getElementById('headerSub').textContent =
    `${projects.length} projeto(s) · ${totalTasks} atividades rastreadas · atualizado ${fmtDate(todayISO())}`;
  document.getElementById('topbarRight').textContent = fmtDate(todayISO());
  document.getElementById('footNote').textContent =
    `Dados persistidos localmente por conta (window.storage). Baseline preservado desde a extração original de cada cronograma — use "recalcular baseline" para redefini-lo.`;
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.getElementById('overviewView').style.display = name==='overview' ? '' : 'none';
  document.getElementById('projectView').style.display = name==='project' ? '' : 'none';
  if(name==='overview'){
    setHeader();
    renderOverview();
  }
}

function refreshAll(){
  setHeader();
  renderOverview();
  renderProjectView();
}

document.querySelectorAll('.tab').forEach(b=>{
  b.addEventListener('click', ()=>switchTab(b.dataset.tab));
});

(async function init(){
  await loadData();
  setHeader();
  renderOverview();
  renderProjectView();
})();
</script>
</body>
</html>
